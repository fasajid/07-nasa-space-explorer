<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="brand-lockup">
        <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
        <div class="brand-copy">
          <p class="eyebrow">NASA / Astronomy Picture of the Day</p>
          <h1>Space Explorer</h1>
        </div>
      </div>
      <p class="header-code"><span>MISSION FILE</span><strong>APOD-01</strong></p>
    </header>

    <main>
      <section class="search-panel" aria-label="Choose an image date range">
        <div class="filters">
          <label class="date-field" for="startDate">
            <span>Start date</span>
            <input type="date" id="startDate" />
          </label>
          <label class="date-field" for="endDate">
            <span>End date</span>
            <input type="date" id="endDate" />
          </label>
          <button id="getImagesButton" type="button"><span aria-hidden="true">↗</span> Get Space Images</button>
        </div>
      </section>

      <section class="space-fact" aria-labelledby="spaceFactTitle">
        <div class="fact-mark" aria-hidden="true">i</div>
        <div>
          <p class="eyebrow">Cosmic field note</p>
          <h2 id="spaceFactTitle">Did You Know?</h2>
          <p id="spaceFact"></p>
        </div>
      </section>

      <section class="gallery-section" aria-labelledby="galleryTitle">
        <div class="gallery-heading">
          <div>
            <p class="eyebrow">NASA / APOD archive</p>
            <h2 id="galleryTitle">Image archive</h2>
          </div>
          <span class="archive-mark">DAILY IMAGERY</span>
        </div>
        <div id="gallery" class="gallery" aria-live="polite">
          <div class="placeholder">
            <div class="placeholder-icon" aria-hidden="true">✦</div>
            <div>
              <h3>Awaiting your coordinates</h3>
              <p>Select a date range above to open the archive.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
    <button id="closeModalButton" class="modal-close" type="button">Close</button>
    <img id="modalImage" class="modal-image" alt="" />
    <h2 id="modalTitle"></h2>
    <p id="modalDate" class="modal-date"></p>
    <p id="modalExplanation" class="modal-explanation"></p>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
